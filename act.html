// canonical source group -> colors
const COLORS = {
  "Tanchuma":      {c:"#16a34a", bg:"#dcfce7"},
  "Sifrei":        {c:"#2563eb", bg:"#dbeafe"},
  "Talmud Bavli":  {c:"#d97706", bg:"#fef3c7"},
  "Midrash Rabbah":{c:"#ea580c", bg:"#ffedd5"},
  "Mekhilta":      {c:"#7c3aed", bg:"#ede9fe"},
  "Yerushalmi":    {c:"#db2777", bg:"#fce7f3"},
  "Seder Olam":    {c:"#0891b2", bg:"#cffafe"},
  "Sifra":         {c:"#0d9488", bg:"#ccfbf1"},
  "Targum":        {c:"#4f46e5", bg:"#e0e7ff"},
  "Other":         {c:"#6b7280", bg:"#f1f5f9"},
};
const colorFor = (g) => COLORS[g] || COLORS["Other"];

// canonicalize any label (TC group or Sefaria label) to a COLORS key
function canon(label){
  const t = (label||"").toLowerCase();
  if (t.includes("tanchuma") || t.includes("tanhuma")) return "Tanchuma";
  if (t.includes("sifrei") || t.includes("sifre")) return "Sifrei";
  if (t.includes("seder olam")) return "Seder Olam";
  if (t.includes("yerushalmi")) return "Yerushalmi";
  if (t.includes("mekhilta")) return "Mekhilta";
  if (t.includes("sifra") || t.includes("torat kohanim")) return "Sifra";
  if (t.includes("targum") || t.includes("onkelos")) return "Targum";
  if (t.includes("rabbah") || t.includes("rabba")) return "Midrash Rabbah";
  if (t.includes("bavli") || t.includes("talmud")) return "Talmud Bavli";
  return "Other";
}

// Sefaria keyword rules -> canonical group
const SEF_RULES = [
  ["Tanchuma", ["tanchuma","tanhuma","תנחומא"]],
  ["Sifrei", ["sifrei","sifre","siphre","ספרי"]],
  ["Seder Olam", ["seder olam","סדר עולם"]],
  ["Sifra", ["sifra","torath kohanim","torat kohanim","ספרא"]],
  ["Mekhilta", ["mekhilta","mechilta","מכילתא"]],
  ["Yerushalmi", ["yerushalmi","jerusalem talmud","ירושלמי"]],
  ["Talmud Bavli", ["talmud","gemara","בבלי","גמרא","berakhot","berakhoth","sotah",
     "sanhedrin","megillah","ketubot","kethuboth","bava metzia","bava bathra",
     "rosh hashana","taanit","chullin","menahot"]],
  ["Targum", ["targum","onkelos","תרגום"]],
  ["Midrash Rabbah", ["rabbah","rabba"]],
];
function detectSef(en, he){
  const t = ((en||"")+" "+(he||"")).toLowerCase();
  const out = [];
  for (const [g, keys] of SEF_RULES){ if (keys.some(k=>t.includes(k))) out.push(g); }
  return [...new Set(out)];
}

const stripTags = (html) => {
  try { return new DOMParser().parseFromString(html||"","text/html").body.textContent||""; }
  catch { return (html||"").replace(/<[^>]+>/g,""); }
};
const norm = (s)=> (s||"").replace(/[\u0591-\u05C7]/g,"")
  .replace(/[\"'\u05f3\u05f4.,:;()\u2013\u2014\/]/g," ").replace(/\s+/g," ").trim();
const firstWords = (s,n)=> norm(s).split(" ").slice(0,n).join(" ");

// parse "Deut 7:12" / "Deut 10:6-7"
function parseRef(ref){
  const m = ref.match(/(\d+):(\d+)(?:-(\d+))?/);
  if(!m) return {ch:0, verses:[]};
  const ch=+m[1], a=+m[2], b=m[3]?+m[3]:+m[2];
  const verses=[]; for(let v=a; v<=b; v++) verses.push(v);
  return {ch, verses};
}
// main dibbur (before / or dash or paren)
const tcKey = (d)=> firstWords((d||"").split(/\s[\/\u2013\u2014]\s|\(/)[0], 2);

async function fetchChapter(chapter){
  const ref = encodeURIComponent("Rashi on Deuteronomy "+chapter);
  const url = "https://www.sefaria.org/api/v3/texts/"+ref+"?version=hebrew&version=english";
  const res = await fetch(url);
  if(!res.ok) throw new Error("Sefaria "+res.status+" ch "+chapter);
  const data = await res.json();
  const vs = data.versions||[];
  const he = (vs.find(v=>(v.language||"").startsWith("he"))||{}).text||[];
  const en = (vs.find(v=>(v.language||"").startsWith("en"))||{}).text||[];
  return {he, en};
}

const STATUS = {
  agree:{label:"Confirmed — both", c:"#16a34a", icon:"\u25CF"},
  differ:{label:"Both — different source", c:"#d97706", icon:"\u25D0"},
  tc:{label:"Torat Chaim adds", c:"#2563eb", icon:"\u25C6"},
  sef:{label:"Sefaria only", c:"#64748b", icon:"\u25CB"},
  none:{label:"Unattributed", c:"#94a3b8", icon:"\u25CC"},
};

function App(){
  const [comments,setComments] = useState([]);
  const [unaligned,setUnaligned] = useState([]);
  const [status,setStatus] = useState("loading");
  const [error,setError] = useState("");
  const [filter,setFilter] = useState(new Set());
  const [details,setDetails] = useState(false);
  const [actOnly,setActOnly] = useState(false);

  useEffect(()=>{
    let cancel=false;
    (async()=>{
      try{
        // index TC by chapter:verse
        const tcByVerse = {};
        TC_RECORDS.forEach((r,i)=>{
          const {ch,verses} = parseRef(r.ref);
          verses.forEach(v=>{ const k=ch+":"+v; (tcByVerse[k]=tcByVerse[k]||[]).push({...r,_i:i,_key:tcKey(r.dibbur)}); });
        });
        const used = new Set();
        const all=[];
        for(const seg of EKEV){
          const {he,en} = await fetchChapter(seg.chapter);
          for(let v=0; v<he.length; v++){
            const vn=v+1;
            if(vn<seg.from||vn>seg.to) continue;
            const hc = Array.isArray(he[v])?he[v]:[];
            const ec = Array.isArray(en[v])?en[v]:[];
            for(let c=0;c<hc.length;c++){
              const heText = stripTags(hc[c]||"");
              if(!heText.trim()) continue;
              const enText = stripTags(ec[c]||"");
              const nHe = norm(heText);
              const cands = tcByVerse[seg.chapter+":"+vn]||[];
              const tc = cands.filter(r=> r._key && nHe.indexOf(r._key)!==-1 && nHe.indexOf(r._key)<45);
              tc.forEach(r=>used.add(r._i));
              const act = ACT_BY_KEY[seg.chapter+":"+vn+":"+(c+1)] || [];
              all.push({ ref:seg.chapter+":"+vn, heText, enText,
                sef:detectSef(enText,heText), tc, act });
            }
          }
        }
        const leftover = TC_RECORDS.map((r,i)=>({...r,_i:i})).filter(r=>!used.has(r._i));
        if(!cancel){ setComments(all); setUnaligned(leftover); setStatus(all.length?"ready":"empty"); }
      }catch(e){ if(!cancel){ setError(String(e.message||e)); setStatus("error"); } }
    })();
    return ()=>{cancel=true;};
  },[]);

  function statusOf(cm){
    const sef = new Set(cm.sef.map(canon));
    const tcg = new Set(cm.tc.map(r=>canon(r.group)));
    if(tcg.size && sef.size) return [...tcg].some(g=>sef.has(g))?"agree":"differ";
    if(tcg.size) return "tc";
    if(sef.size) return "sef";
    return "none";
  }

  const enriched = useMemo(()=> comments.map(cm=>({...cm, st:statusOf(cm)})), [comments]);
  const counts = useMemo(()=>{ const o={agree:0,differ:0,tc:0,sef:0,none:0}; enriched.forEach(c=>o[c.st]++); return o; }, [enriched]);
  const actStats = useMemo(()=>{ let conf=0,add=0; enriched.forEach(c=>(c.act||[]).forEach(a=>{ const cf=c.tc.some(r=>canon(r.group)===canon(a.group))||c.sef.some(g=>canon(g)===canon(a.group)); cf?conf++:add++; })); return {conf,add}; }, [enriched]);
  const toggle = (k)=> setFilter(p=>{const n=new Set(p); n.has(k)?n.delete(k):n.add(k); return n;});
  const visible = enriched.filter(c=> (filter.size===0 || filter.has(c.st)) && (!actOnly || (c.act&&c.act.length)));

  return (
    <div style={{fontFamily:"Georgia, serif", maxWidth:940, margin:"0 auto", padding:20, color:"#1e293b"}}>
      <h1 style={{fontSize:24, marginBottom:4}}>רש"י בצבעים — פרשת עקב <span style={{fontSize:14,color:"#7c3aed"}}>+ ACT</span></h1>
      <p style={{fontSize:13, color:"#64748b", marginTop:0}}>
        Standard Rashi (Deut. 7:12–11:25), reconciling two source layers:
        <b> Sefaria</b> (source names spotted in the text/translation) and
        <b> Torat Chaim</b> (hand-extracted footnotes), and <b>ACT</b> (Eliezer's computational alignment, origin 8). Each comment shows how the layers confirm or extend each other.
      </p>

      {status==="loading" && <p>Fetching Ekev from Sefaria…</p>}
      {status==="error" && (
        <div style={{background:"#fef2f2",border:"1px solid #fecaca",padding:12,borderRadius:8}}>
          <b>Couldn't reach Sefaria:</b> {error}
          <div style={{fontSize:12,color:"#991b1b",marginTop:6}}>Serve over http(s), not file://.</div>
        </div>
      )}

      {status==="ready" && (<>
        {/* status filter / stats */}
        <div style={{display:"flex",flexWrap:"wrap",gap:8,margin:"14px 0"}}>
          {Object.keys(STATUS).map(k=>(
            <button key={k} onClick={()=>toggle(k)} style={{
              display:"flex",alignItems:"center",gap:6,padding:"5px 11px",borderRadius:999,
              cursor:"pointer",fontSize:13,border:"1.5px solid "+STATUS[k].c,
              background: filter.has(k)?STATUS[k].c:"#fff", color: filter.has(k)?"#fff":"#1e293b"}}>
              <span style={{color: filter.has(k)?"#fff":STATUS[k].c}}>{STATUS[k].icon}</span>
              {STATUS[k].label} <b>· {counts[k]}</b>
            </button>
          ))}
        </div>

        <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"10px 14px",
          fontSize:13,marginBottom:6}}>
          Torat Chaim <b>confirms</b> Sefaria on <b>{counts.agree}</b> comment(s) and
          <b> adds {counts.tc}</b> attribution(s) Sefaria missed.
        </div>
        <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"10px 14px",
          fontSize:13,marginBottom:6}}>
          <b>ACT</b> (computational, origin 8) <b>confirms</b> a manually-attributed source on <b>{actStats.conf}</b> comment(s)
          and <b>adds {actStats.add}</b> parallel(s) not attributed by hand.
          <span style={{color:"#6d28d9",fontSize:11}}> Showing ACT's classical-source matches (later anthologies filtered).</span>
        </div>
        <button onClick={()=>setActOnly(v=>!v)} style={{display:"inline-flex",alignItems:"center",gap:6,
          padding:"5px 11px",borderRadius:999,cursor:"pointer",fontSize:13,marginBottom:6,
          border:"1.5px solid #7c3aed", background: actOnly?"#7c3aed":"#fff", color: actOnly?"#fff":"#1e293b"}}>
          ✦ ACT only <b>· {enriched.filter(c=>c.act&&c.act.length).length}</b>
        </button>

        <label style={{fontSize:13,cursor:"pointer",display:"inline-block",marginBottom:12}}>
          <input type="checkbox" checked={details} onChange={e=>setDetails(e.target.checked)} /> Show details (loci · footnotes · confidence)
        </label>

        {unaligned.length>0 && (
          <div style={{fontSize:12,color:"#92400e",background:"#fffbeb",border:"1px solid #fde68a",
            borderRadius:8,padding:"8px 12px",marginBottom:12}}>
            {unaligned.length} Torat Chaim record(s) couldn't be auto-aligned to a Sefaria comment (dibbur didn't match) — listed at the bottom for manual placement.
          </div>
        )}

        <div dir="rtl" style={{display:"flex",flexDirection:"column",gap:10}}>
          {visible.map((cm,i)=>{
            const st = STATUS[cm.st];
            const primaryG = cm.tc.length?canon(cm.tc[0].group):(cm.sef.length?canon(cm.sef[0]):null);
            const col = primaryG?colorFor(primaryG):{c:"#94a3b8",bg:"#ffffff"};
            const isNone = cm.st==="none";
            return (
              <div key={i} style={{background:col.bg, borderRight:"5px solid "+col.c, borderRadius:6,
                padding:"10px 14px", border: isNone?"1.5px dashed #94a3b8":"1px solid #e2e8f0", borderRightWidth:5}}>
                <div dir="ltr" style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:5}}>
                  <span style={{fontSize:11,color:"#64748b",fontFamily:"monospace"}}>Deut. {cm.ref}</span>
                  <span style={{fontSize:11,fontWeight:"bold",color:st.c}}>{st.icon} {st.label}</span>
                </div>
                <div dir="ltr" style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                  {cm.tc.map((r,j)=>{ const cc=colorFor(canon(r.group)); return (
                    <span key={"t"+j} style={{fontSize:11,padding:"2px 7px",borderRadius:4,
                      background:cc.c,color:"#fff"}}>
                      {details? (r.work+" "+r.locus).trim() : canon(r.group)}
                      <span style={{opacity:.8,fontStyle:"italic"}}> · TC{details&&r.conf?(" · "+r.conf):""}</span>
                    </span>
                  );})}
                  {cm.sef.filter(g=> !cm.tc.some(r=>canon(r.group)===canon(g))).map((g,j)=>{ const cc=colorFor(canon(g)); return (
                    <span key={"s"+j} style={{fontSize:11,padding:"2px 7px",borderRadius:4,
                      background:"#fff",color:cc.c,border:"1px solid "+cc.c}}>
                      {canon(g)} <span style={{opacity:.7,fontStyle:"italic"}}>· Sefaria</span>
                    </span>
                  );})}
                  {(cm.act||[]).map((a,j)=>{ const confirm=cm.tc.some(r=>canon(r.group)===canon(a.group))||cm.sef.some(g=>canon(g)===canon(a.group)); return (
                    <span key={"a"+j} style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#7c3aed",color:"#fff",

                      <b>ACT</b> · {a.work} <span style={{opacity:.85}}>{a.score}</span>

                    </span>
                  );})}
                  {isNone && <span style={{fontSize:11,color:"#94a3b8"}}>רש"י עצמאי?</span>}
                </div>
                <div style={{fontSize:18,lineHeight:1.7}}>{cm.heText}</div>
                {details && cm.tc.length>0 && (
                  <div dir="rtl" style={{fontSize:11,color:"#475569",marginTop:6,borderTop:"1px dotted #cbd5e1",paddingTop:4}}>
                    {cm.tc.map((r,j)=>(<div key={j}>{r.work} {r.locus} — הערה {r.fn} ({r.conf})</div>))}
                  </div>

              </div>
            );

        </div>

        {unaligned.length>0 && (
          <div style={{marginTop:22}}>
            <h3 style={{fontSize:15}}>Torat Chaim records not auto-aligned</h3>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {unaligned.map((r,i)=>{ const cc=colorFor(canon(r.group)); return (
                <div key={i} dir="ltr" style={{fontSize:12,padding:"6px 10px",borderRadius:6,
                  background:cc.bg,borderRight:"4px solid "+cc.c}}>
                  <b>{r.ref}</b> · {r.work} {r.locus} · <span dir="rtl">{r.dibbur}</span> <i>({r.conf})</i>
                </div>
              );})}
            </div>
          </div>
        )}
      </>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
