// canonicalize any label (TC group or Sefaria label) to a COLORS key
function canon(label){
  const t = (label||"").toLowerCase();
  if (t.includes("tanchuma") || t.includes("tanhuma")) return "Tanchuma";
  if (t.includes("sifrei") || t.includes("sifre")) return "Sifrei";
  if (t.includes("seder olam")) return "Seder Olam";
  if (t.includes("yerushalmi")) return "Yerushalmi";
  if (t.includes("mekhilta")) return "Mekhilta";
  if (t.includes("sifra") || t.includes("torat kohanim")) return "Sifra";
  if (t.includes("targum") || t.includes("onkelos")) return "Targum";
  if (t.includes("rabbah") || t.includes("rabba")) return "Midrash Rabbah";
  if (t.includes("bavli") || t.includes("talmud")) return "Talmud Bavli";
  return "Other";
}

const SEF_RULES = [
  ["Tanchuma", ["tanchuma","tanhuma","תנחומא"]],
  ["Sifrei", ["sifrei","sifre","siphre","ספרי"]],
  ["Seder Olam", ["seder olam","סדר עולם"]],
  ["Sifra", ["sifra","torath kohanim","torat kohanim","ספרא"]],
  ["Mekhilta", ["mekhilta","mechilta","מכילתא"]],
  ["Yerushalmi", ["yerushalmi","jerusalem talmud","ירושלמי"]],
  ["Talmud Bavli", ["talmud","gemara","בבלי","גמרא","berakhot","berakhoth","sotah",
     "sanhedrin","megillah","ketubot","kethuboth","bava metzia","bava bathra",
     "rosh hashana","taanit","chullin","menahot"]],
  ["Targum", ["targum","onkelos","תרגום"]],
  ["Midrash Rabbah", ["rabbah","rabba"]],
];
function detectSef(en, he){
  const t = ((en||"")+" "+(he||"")).toLowerCase();
  const out = [];
  for (const [g, keys] of SEF_RULES){ if (keys.some(k=>t.includes(k))) out.push(g); }
  return [...new Set(out)];
}

const stripTags = (html) => {
  try { return new DOMParser().parseFromString(html||"","text/html").body.textContent||""; }
  catch { return (html||"").replace(/<[^>]+>/g,""); }
};
const norm = (s)=> (s||"").replace(/[\u0591-\u05C7]/g,"")
  .replace(/[\"'\u05f3\u05f4.,:;()\u2013\u2014\/]/g," ").replace(/\s+/g," ").trim();
const firstWords = (s,n)=> norm(s).split(" ").slice(0,n).join(" ");

// parse "Deut 7:12" / "Deut 10:6-7"
function parseRef(ref){
  const m = ref.match(/(\d+):(\d+)(?:-(\d+))?/);
  if(!m) return {ch:0, verses:[]};
  const ch=+m[1], a=+m[2], b=m[3]?+m[3]:+m[2];
  const verses=[]; for(let v=a; v<=b; v++) verses.push(v);
  return {ch, verses};
}
// main dibbur (before / or dash or paren)
const tcKey = (d)=> firstWords((d||"").split(/\s[\/\u2013\u2014]\s|\(/)[0], 2);

async function fetchChapter(chapter){
  const ref = encodeURIComponent("Rashi on Deuteronomy "+chapter);
  const url = "https://www.sefaria.org/api/v3/texts/"+ref+"?version=hebrew&version=english";
  const res = await fetch(url);
  if(!res.ok) throw new Error("Sefaria "+res.status+" ch "+chapter);
  const data = await res.json();
  const vs = data.versions||[];
  const he = (vs.find(v=>(v.language||"").startsWith("he"))||{}).text||[];
  const en = (vs.find(v=>(v.language||"").startsWith("en"))||{}).text||[];
  return {he, en};
}

              tc.forEach(r=>used.add(r._i));
              const act = ACT_BY_KEY[seg.chapter+":"+vn+":"+(c+1)] || [];
              const gel = (gelByVerse[seg.chapter+":"+vn]||[]).filter(r=> r._key && nHe.indexOf(r._key)!==-1 && nHe.indexOf(r._key)<45);
              const gnote = (gelNotesByVerse[seg.chapter+":"+vn]||[]).filter(r=> r._key && nHe.indexOf(r._key)!==-1 && nHe.indexOf(r._key)<45);
              all.push({ ref:seg.chapter+":"+vn, cid:seg.chapter+":"+vn+":"+(c+1), heText, enText,
                sef:detectSef(enText,heText), tc, gel, gnote, act });
            }
          }
        }
        const leftover = TC_RECORDS.map((r,i)=>({...r,_i:i})).filter(r=>!used.has(r._i));
        if(!cancel){ setComments(all); setUnaligned(leftover); setStatus(all.length?"ready":"empty"); }
      }catch(e){ if(!cancel){ setError(String(e.message||e)); setStatus("error"); } }
    })();
    return ()=>{cancel=true;};
  },[]);

  function statusOf(cm){
    const sets = [
      new Set(cm.sef.map(canon)),
      new Set(cm.tc.map(r=>canon(r.group))),
      new Set((cm.gel||[]).map(r=>canon(r.group))),
      new Set((cm.act||[]).map(a=>canon(a.group))),
    ].filter(x=>x.size);
    if(sets.length===0) return "none";
    if(sets.length===1) return "single";
    let inter = new Set(sets[0]);
    for(let i=1;i<sets.length;i++){ inter = new Set([...inter].filter(g=>sets[i].has(g))); }
    return inter.size ? "agree" : "differ";
  }

  const enriched = useMemo(()=> comments.map(cm=>({...cm, st:statusOf(cm)})), [comments]);
  const counts = useMemo(()=>{ const o={agree:0,differ:0,single:0,none:0}; enriched.forEach(c=>o[c.st]++); return o; }, [enriched]);
  const actStats = useMemo(()=>{ let conf=0,add=0; enriched.forEach(c=>(c.act||[]).forEach(a=>{ const cf=c.tc.some(r=>canon(r.group)===canon(a.group))||c.sef.some(g=>canon(g)===canon(a.group))||(c.gel||[]).some(r=>canon(r.group)===canon(a.group)); cf?conf++:add++; })); return {conf,add}; }, [enriched]);
  const toggle = (k)=> setFilter(p=>{const n=new Set(p); n.has(k)?n.delete(k):n.add(k); return n;});
  const visible = enriched.filter(c=> (filter.size===0 || filter.has(c.st)) && (!actOnly || (c.act&&c.act.length)));

  return (
    <div style={{fontFamily:"Georgia, serif", maxWidth:940, margin:"0 auto", padding:20, color:"#1e293b"}}>
      <h1 style={{fontSize:24, marginBottom:4}}>רש"י בצבעים — פרשת עקב <span style={{fontSize:14,color:"#7c3aed"}}>· גרסה 0.2</span></h1>
      <p dir="rtl" style={{fontSize:13, color:"#64748b", marginTop:0, lineHeight:1.6}}>
        פירוש רש"י (דברים ז׳:י״ב–י״א:כ״ה) עם שכבות ייחוס: <b>ספריא</b>, <b>תורת חיים</b>, <b>גלברד</b> (לפשוטו של רש"י · מקור 7 — כל עקב), ו-<b>ACT</b> (יישור חישובי · מקור 8).
        חדש בגרסה זו: <b>פאנל הכרעת חוקר</b> לכל תגובה — אישור/פסילה עם סיבה והערה (מקור 9, נשמר מקומית); לכל התאמת ACT יש כפתור <b>diff</b> משלה — טקסט רש"י מול טקסט המקור, מילים תואמות מודגשות. ACT מציע כמה מועמדים (מקור 8); החוקר מכריע.
      </p>

      {status==="loading" && <p>Fetching Ekev from Sefaria…</p>}
      {status==="error" && (
        <div style={{background:"#fef2f2",border:"1px solid #fecaca",padding:12,borderRadius:8}}>
          <b>Couldn't reach Sefaria:</b> {error}
          <div style={{fontSize:12,color:"#991b1b",marginTop:6}}>Serve over http(s), not file://.</div>
        </div>
      )}

      {status==="ready" && (<>
        {/* status filter / stats */}
        <div style={{display:"flex",flexWrap:"wrap",gap:8,margin:"14px 0"}}>
          {Object.keys(STATUS).map(k=>(
            <button key={k} onClick={()=>toggle(k)} style={{
              display:"flex",alignItems:"center",gap:6,padding:"5px 11px",borderRadius:999,
              cursor:"pointer",fontSize:13,border:"1.5px solid "+STATUS[k].c,
              background: filter.has(k)?STATUS[k].c:"#fff", color: filter.has(k)?"#fff":"#1e293b"}}>
              <span style={{color: filter.has(k)?"#fff":STATUS[k].c}}>{STATUS[k].icon}</span>
              {STATUS[k].label} <b>· {counts[k]}</b>
            </button>
          ))}
        </div>

        <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"10px 14px",
          fontSize:13,marginBottom:6}}>
          Torat Chaim <b>confirms</b> Sefaria on <b>{counts.agree}</b> comment(s) and
          <b> adds {counts.tc}</b> attribution(s) Sefaria missed.
        </div>
        <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"10px 14px",
          fontSize:13,marginBottom:6}}>
          <b>ACT</b> (computational, origin 8) <b>confirms</b> a manually-attributed source on <b>{actStats.conf}</b> comment(s)
          and <b>adds {actStats.add}</b> parallel(s) not attributed by hand.
          <span style={{color:"#6d28d9",fontSize:11}}> Showing ACT's classical-source matches (later anthologies filtered).</span>
        </div>
        <button onClick={()=>setActOnly(v=>!v)} style={{display:"inline-flex",alignItems:"center",gap:6,
          padding:"5px 11px",borderRadius:999,cursor:"pointer",fontSize:13,marginBottom:6,
          border:"1.5px solid #7c3aed", background: actOnly?"#7c3aed":"#fff", color: actOnly?"#fff":"#1e293b"}}>
          ✦ ACT only <b>· {enriched.filter(c=>c.act&&c.act.length).length}</b>
        </button>

        <label style={{fontSize:13,cursor:"pointer",display:"inline-block",marginBottom:12}}>
          <input type="checkbox" checked={details} onChange={e=>setDetails(e.target.checked)} /> Show details (loci · footnotes · confidence)
        </label>

        {unaligned.length>0 && (
          <div style={{fontSize:12,color:"#92400e",background:"#fffbeb",border:"1px solid #fde68a",
            borderRadius:8,padding:"8px 12px",marginBottom:12}}>
            {unaligned.length} Torat Chaim record(s) couldn't be auto-aligned to a Sefaria comment (dibbur didn't match) — listed at the bottom for manual placement.
          </div>
        )}

        <div dir="rtl" style={{display:"flex",flexDirection:"column",gap:10}}>
          {visible.map((cm,i)=>{
            const st = STATUS[cm.st];
            const primaryG = cm.tc.length?canon(cm.tc[0].group):((cm.gel&&cm.gel.length)?canon(cm.gel[0].group):(cm.sef.length?canon(cm.sef[0]):((cm.act&&cm.act.length)?canon(cm.act[0].group):null)));
            const actOnly = !cm.tc.length && !(cm.gel&&cm.gel.length) && !cm.sef.length && !!(cm.act&&cm.act.length);
            const confirmedHere = Object.keys(verdicts).some(k=>k.indexOf(cm.cid+"|")===0 && verdicts[k] && verdicts[k].status==="confirmed");
            const faint = actOnly && !confirmedHere;
            const base = primaryG?colorFor(primaryG):{c:"#94a3b8",bg:"#ffffff"};
            const col = faint ? {c:base.c, bg:base.c+"12"} : base;
            const isNone = cm.st==="none";
            const attrs = [
              ...cm.tc.map((r,j)=>({id:"tc:"+j,kind:"תורת חיים",label:(r.work||canon(r.group)),loc:r.locus,color:colorFor(canon(r.group)).c})),
              ...((cm.gel)||[]).map((r,j)=>({id:"gel:"+j,kind:"גלברד",label:(r.work||canon(r.group)),loc:r.locus,note:r.note,color:colorFor(canon(r.group)).c})),
              ...cm.sef.filter(g=>!cm.tc.some(r=>canon(r.group)===canon(g))).map((g)=>({id:"sef:"+canon(g),kind:"ספריא",label:canon(g),color:colorFor(canon(g)).c})),
              ...(cm.act||[]).map((a,j)=>({id:"act:"+j,kind:"ACT",label:a.work,score:a.score,color:"#7c3aed",diffData:(a.rashi&&a.rashi.length)?a:null})),
            ];
            const anyConfirmed = Object.keys(verdicts).some(k=>k.indexOf(cm.cid+"|")===0 && verdicts[k] && verdicts[k].status==="confirmed");
            return (
              <div key={i} style={{background:col.bg, borderRight:(faint?"4px dashed "+col.c+"99":"5px solid "+col.c), borderRadius:6,
                padding:"10px 14px", border: isNone?"1.5px dashed #94a3b8":"1px solid #e2e8f0", borderRightWidth:faint?4:5}}>
                <div dir="ltr" style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:5}}>
                  <span style={{fontSize:11,color:"#64748b",fontFamily:"monospace"}}>Deut. {cm.ref}</span>
                  <span style={{fontSize:11,fontWeight:"bold",color:st.c}}>{st.icon} {st.label}</span>
                  {faint && <span style={{fontSize:10,color:"#7c3aed",fontStyle:"italic"}}>· הצעת ACT (לא מאושר)</span>}
                  <button onClick={()=>setPanelOpen(p=>({...p,[cm.cid]:!p[cm.cid]}))} style={{marginInlineStart:"auto",fontSize:11,padding:"2px 9px",borderRadius:5,cursor:"pointer",border:"1px solid #7c3aed",background: panelOpen[cm.cid]?"#7c3aed":"#fff",color: panelOpen[cm.cid]?"#fff":"#7c3aed"}}>הכרעת חוקר</button>
                </div>
                <div dir="ltr" style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                  {cm.tc.map((r,j)=>{ const cc=colorFor(canon(r.group)); return (
                    <span key={"t"+j} style={{fontSize:11,padding:"2px 7px",borderRadius:4,
                      background:cc.c,color:"#fff"}}>
                      {details? (r.work+" "+r.locus).trim() : canon(r.group)}
                      <span style={{opacity:.8,fontStyle:"italic"}}> · TC{details&&r.conf?(" · "+r.conf):""}</span>
                    </span>
                  );})}
                  {(cm.gel||[]).map((r,j)=>{ const cc=colorFor(canon(r.group)); return (
                    <span key={"g"+j} style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:cc.c,color:"#fff",display:"inline-flex",gap:4,alignItems:"center"}}>
                      📖 {details?(r.work+" "+(r.locus||"")).trim():canon(r.group)} <span style={{opacity:.85,fontStyle:"italic"}}>· גלברד</span>
                    </span>
                  );})}
                  {cm.sef.filter(g=> !cm.tc.some(r=>canon(r.group)===canon(g))).map((g,j)=>{ const cc=colorFor(canon(g)); return (
                    <span key={"s"+j} style={{fontSize:11,padding:"2px 7px",borderRadius:4,
                      background:"#fff",color:cc.c,border:"1px solid "+cc.c}}>
                      {canon(g)} <span style={{opacity:.7,fontStyle:"italic"}}>· Sefaria</span>
                    </span>
                  );})}
                  {(cm.act||[]).map((a,j)=>{ const confirm=cm.tc.some(r=>canon(r.group)===canon(a.group))||cm.sef.some(g=>canon(g)===canon(a.group))||(cm.gel||[]).some(r=>canon(r.group)===canon(a.group)); const dk=cm.cid+"|act"+j; const hasDiff=a.rashi&&a.rashi.length; return (
                    <span key={"a"+j} style={{display:"inline-flex",alignItems:"stretch",borderRadius:4,overflow:"hidden",border:"1px solid #7c3aed"}}>
                      <span style={{fontSize:11,padding:"2px 7px",background:"#7c3aed",color:"#fff",display:"inline-flex",alignItems:"center",gap:5}}>
                        <b>ACT</b> · {a.ref||a.work} <span style={{opacity:.85}}>{a.score}</span>
                        <span style={{fontSize:10,opacity:.95,borderInlineStart:"1px solid rgba(255,255,255,.5)",paddingInlineStart:5}}>{confirm?"✓ מאשש":"＋ מוסיף"}</span>
                      </span>
                      {hasDiff && <button onClick={()=>setDiffOpen(p=>({...p,[dk]:!p[dk]}))}
                        style={{fontSize:10,padding:"0 8px",cursor:"pointer",border:"none",fontWeight:"bold",
                        background: diffOpen[dk]?"#4c1d95":"#c4b5fd", color: diffOpen[dk]?"#fff":"#4c1d95"}}>diff</button>}
                    </span>
                  );})}
                  {isNone && <span style={{fontSize:11,color:"#94a3b8"}}>רש"י עצמאי?</span>}
                  {anyConfirmed && <span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#d97706",color:"#fff"}}>✓ מאושר · חוקר</span>}
                </div>
                <div style={{fontSize:18,lineHeight:1.7}}>{cm.heText}</div>
                {(cm.act||[]).map((a,j)=>{ const dk=cm.cid+"|act"+j; if(!diffOpen[dk]||!(a.rashi&&a.rashi.length)) return null; return (
                  <div key={"d"+j} dir="rtl" style={{marginTop:8,background:"#faf5ff",border:"1px solid #e9d5ff",borderRadius:8,padding:"8px 12px"}}>
                    <div style={{fontSize:11,color:"#6d28d9",marginBottom:4,fontWeight:"bold",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                      <span>ACT · {a.work}{a.ref?(" · "+a.ref):""} · יישור {a.score}</span>
                      {a.url && <a href={a.url} target="_blank" rel="noopener" style={{color:"#2563eb",fontWeight:"normal"}}>↗ פתח בספריא</a>}
                    </div>
                    <DiffView data={a} />
                  </div>
                );})}
                {(cm.gnote||[]).map((n,j)=>(
                  <div key={"gn"+j} dir="rtl" style={{fontSize:11,color:"#92400e",fontStyle:"italic",marginTop:6,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:6,padding:"4px 9px"}}>📖 {n.note}</div>
                ))}
                {details && cm.tc.length>0 && (
                  <div dir="rtl" style={{fontSize:11,color:"#475569",marginTop:6,borderTop:"1px dotted #cbd5e1",paddingTop:4}}>
                    {cm.tc.map((r,j)=>(<div key={j}>{r.work} {r.locus} — הערה {r.fn} ({r.conf})</div>))}
                  </div>
                )}
                {panelOpen[cm.cid] && (
                  <div dir="rtl" style={{marginTop:8,borderTop:"1px solid #e2e8f0",paddingTop:8}}>
                    <div style={{fontSize:12,fontWeight:"bold",color:"#7c3aed",marginBottom:6}}>הכרעת חוקר <span style={{fontWeight:"normal",color:"#94a3b8"}}>(מקור 9 · נשמר מקומית)</span></div>
                    {attrs.length===0 && <div style={{fontSize:12,color:"#94a3b8"}}>אין ייחוסים לתגובה זו — מועמד ל"רש"י עצמאי".</div>}
                    {attrs.map(a=>{ const vk=cm.cid+"|"+a.id; const v=verdicts[vk]||{}; return (
                      <div key={a.id} style={{display:"flex",flexDirection:"column",gap:4,padding:"6px 8px",borderRadius:6,marginBottom:5,
                        background: v.status==="confirmed"?"#ecfdf5":v.status==="rejected"?"#fef2f2":"#f8fafc",
                        border:"1px solid "+(v.status==="confirmed"?"#a7f3d0":v.status==="rejected"?"#fecaca":"#e2e8f0")}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          <span style={{width:9,height:9,borderRadius:"50%",background:a.color,display:"inline-block"}}></span>
                          <b style={{fontSize:13,textDecoration: v.status==="rejected"?"line-through":"none"}}>{a.label}</b>
                          <span style={{fontSize:11,color:"#64748b"}}>{a.kind}{a.score?(" · "+a.score):""}{a.loc?(" · "+a.loc):""}</span>
                          <div style={{marginInlineStart:"auto",display:"flex",gap:4}}>
                            <button onClick={()=>setVerdict(vk, v.status==="confirmed"?null:{status:"confirmed",reason:undefined})} style={btn(v.status==="confirmed","#16a34a")}>✓ אשר</button>
                            <button onClick={()=>setVerdict(vk, v.status==="rejected"?null:{status:"rejected"})} style={btn(v.status==="rejected","#dc2626")}>✗ פסול</button>
                            {a.diffData && <button onClick={()=>setDiffOpen(p=>({...p,[vk]:!p[vk]}))} style={btn(diffOpen[vk],"#7c3aed")}>diff</button>}
                          </div>
                        </div>
                        {v.status==="rejected" && (
                          <select value={v.reason||""} onChange={e=>setVerdict(vk,{reason:e.target.value})} style={{fontSize:12,padding:"3px 6px",borderRadius:5,border:"1px solid #fecaca"}}>
                            <option value="">— בחר סיבת פסילה —</option>
                            {REJECT_REASONS.map(r=><option key={r} value={r}>{r}</option>)}
                          </select>
                        )}
                        <input value={v.note||""} onChange={e=>setVerdict(vk,{note:e.target.value})} placeholder="הערת חוקר…" style={{fontSize:12,padding:"4px 7px",borderRadius:5,border:"1px solid #e2e8f0"}} />
                        {a.diffData && diffOpen[vk] && <DiffView data={a.diffData} />}
                      </div>
                    );})}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {unaligned.length>0 && (
          <div style={{marginTop:22}}>
            <h3 style={{fontSize:15}}>Torat Chaim records not auto-aligned</h3>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {unaligned.map((r,i)=>{ const cc=colorFor(canon(r.group)); return (
                <div key={i} dir="ltr" style={{fontSize:12,padding:"6px 10px",borderRadius:6,
                  background:cc.bg,borderRight:"4px solid "+cc.c}}>
                  <b>{r.ref}</b> · {r.work} {r.locus} · <span dir="rtl">{r.dibbur}</span> <i>({r.conf})</i>
                </div>
              );})}
            </div>
          </div>
        )}
      </>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
