<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>רש"י בצבעים — פרשת עקב</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>body{margin:0;background:#f8fafc}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// Ekev = Deuteronomy 7:12 – 11:25
const EKEV = [
  { chapter: 7, from: 12, to: 26 },
  { chapter: 8, from: 1, to: 20 },
  { chapter: 9, from: 1, to: 29 },
  { chapter: 10, from: 1, to: 22 },
  { chapter: 11, from: 1, to: 25 },
];

const SOURCE_RULES = [
  { label: "Midrash Tanchuma", color: "#16a34a", bg: "#dcfce7",
    keys: ["tanchuma","tanhuma","tanḥuma","תנחומא"] },
  { label: "Sifrei", color: "#2563eb", bg: "#dbeafe",
    keys: ["sifrei","sifre","siphre","sifré","ספרי"] },
  { label: "Sifra / Torat Kohanim", color: "#0d9488", bg: "#ccfbf1",
    keys: ["sifra","torath kohanim","torat kohanim","ספרא","תורת כהנים"] },
  { label: "Mekhilta", color: "#7c3aed", bg: "#ede9fe",
    keys: ["mekhilta","mechilta","מכילתא"] },
  { label: "Yerushalmi", color: "#db2777", bg: "#fce7f3",
    keys: ["yerushalmi","jerusalem talmud","ירושלמי"] },
  { label: "Talmud Bavli", color: "#d97706", bg: "#fef3c7",
    keys: ["talmud","gemara","בבלי","גמרא","berakhot","berakhoth","berachot","sotah",
      "soṭah","sanhedrin","shabbat","sabbath","yoma","taanit","taanith","menahot",
      "menachoth","chullin","hullin","ḥullin","bekhorot","bekhoroth","arakhin",
      "bava batra","baba bathra","ketubot","kethuboth","kiddushin","nedarim",
      "pesachim","pesahim","rosh hashana","sukkah","succah","megillah",
      "avodah zarah","makkot","makkoth","horayot"] },
  { label: "Targum / Onkelos", color: "#4f46e5", bg: "#e0e7ff",
    keys: ["targum","onkelos","onḳelos","אונקלוס","תרגום"] },
  { label: "Midrash Rabbah", color: "#ea580c", bg: "#ffedd5",
    keys: ["rabbah","rabba"] },
];
const RESIDUE = { label: "Original Rashi (no source flagged)", color: "#475569", bg: "#ffffff" };

const stripTags = (html) => {
  try { return new DOMParser().parseFromString(html||"","text/html").body.textContent||""; }
  catch { return (html||"").replace(/<[^>]+>/g,""); }
};
const extractFootnotes = (html) => {
  try {
    const d = new DOMParser().parseFromString(html||"","text/html");
    return [...d.querySelectorAll("i.footnote, .footnote")].map(n=>n.textContent.trim()).filter(Boolean);
  } catch { return []; }
};
const detectSources = (en, he) => {
  const fields = [{name:"translation", text: en||""}, {name:"hebrew", text: he||""}];
  const matches = [];
  for (const rule of SOURCE_RULES) {
    let found = null;
    for (const f of fields) {
      const lc = f.text.toLowerCase();
      for (const k of rule.keys) {
        const idx = lc.indexOf(k.toLowerCase());
        if (idx !== -1) {
          const start = Math.max(0, idx - 30);
          found = { keyword: k, where: f.name, snippet: f.text.slice(start, idx + k.length + 30).trim() };
          break;
        }
      }
      if (found) break;
    }
    if (found) matches.push({ ...rule, evidence: found });
  }
  return matches;
};
async function fetchChapter(chapter) {
  const ref = encodeURIComponent(`Rashi on Deuteronomy ${chapter}`);
  const url = `https://www.sefaria.org/api/v3/texts/${ref}?version=hebrew&version=english`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sefaria ${res.status} for chapter ${chapter}`);
  const data = await res.json();
  const versions = data.versions || [];
  const he = versions.find(v => (v.language||"").startsWith("he"))?.text || [];
  const en = versions.find(v => (v.language||"").startsWith("en"))?.text || [];
  return { he, en };
}

function App() {
  const [comments, setComments] = useState([]);
  const [status, setStatus] = useState("loading");
  const [error, setError] = useState("");
  const [onlyResidue, setOnlyResidue] = useState(false);
  const [activeFilters, setActiveFilters] = useState(new Set());
  const [showDebug, setShowDebug] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const all = [];
        for (const seg of EKEV) {
          const { he, en } = await fetchChapter(seg.chapter);
          for (let v = 0; v < he.length; v++) {
            const verseNum = v + 1;
            if (verseNum < seg.from || verseNum > seg.to) continue;
            const heC = Array.isArray(he[v]) ? he[v] : [];
            const enC = Array.isArray(en[v]) ? en[v] : [];
            for (let c = 0; c < heC.length; c++) {
              const heHtml = heC[c]||"", enHtml = enC[c]||"";
              const heText = stripTags(heHtml);
              if (!heText.trim()) continue;
              const enText = stripTags(enHtml);
              all.push({ ref:`${seg.chapter}:${verseNum}`, heText, enText,
                sources: detectSources(enText, heText) });
            }
          }
        }
        if (!cancelled) { setComments(all); setStatus(all.length?"ready":"empty"); }
      } catch (e) { if (!cancelled){ setError(String(e.message||e)); setStatus("error"); } }
    })();
    return () => { cancelled = true; };
  }, []);

  const stats = useMemo(() => {
    const counts = {}; let residue = 0;
    for (const c of comments) {
      if (!c.sources.length) { residue++; continue; }
      counts[c.sources[0].label] = (counts[c.sources[0].label]||0)+1;
    }
    return { counts, residue, total: comments.length };
  }, [comments]);

  const toggleFilter = (label) => setActiveFilters(prev => {
    const next = new Set(prev); next.has(label)?next.delete(label):next.add(label); return next;
  });

  const visible = comments.filter(c => {
    if (onlyResidue) return c.sources.length === 0;
    if (activeFilters.size === 0) return true;
    if (c.sources.length === 0) return activeFilters.has(RESIDUE.label);
    return c.sources.some(s => activeFilters.has(s.label));
  });
  const usedRules = SOURCE_RULES.filter(r => stats.counts[r.label]);

  return (
    <div style={{fontFamily:"Georgia, serif", maxWidth:920, margin:"0 auto", padding:20, color:"#1e293b"}}>
      <h1 style={{fontSize:24, marginBottom:4}}>רש"י בצבעים — פרשת עקב</h1>
      <p style={{fontSize:13, color:"#64748b", marginTop:0}}>
        Standard Rashi (Deut. 7:12–11:25), colored by source names found in the Sefaria text/translation.
        <strong> "No source flagged" = unattributed in this apparatus, not proven original.</strong> ACT / passim come later.
      </p>
      {status==="loading" && <p>Fetching Ekev from Sefaria…</p>}
      {status==="empty" && <p>Loaded, but no comments parsed — tell me and I'll adjust the parser.</p>}
      {status==="error" && (
        <div style={{background:"#fef2f2", border:"1px solid #fecaca", padding:12, borderRadius:8}}>
          <strong>Couldn't reach Sefaria:</strong> {error}
          <div style={{fontSize:12, marginTop:6, color:"#991b1b"}}>
            Likely a file:// fetch block — run a local server (see note) or tell me and I'll bake the data in.
          </div>
        </div>
      )}
      {status==="ready" && (<>
        <div style={{display:"flex", flexWrap:"wrap", gap:8, margin:"14px 0", alignItems:"center"}}>
          {usedRules.map(r => (
            <button key={r.label} onClick={()=>toggleFilter(r.label)} style={{
              display:"flex", alignItems:"center", gap:6, padding:"4px 10px", borderRadius:999,
              cursor:"pointer", fontSize:13, border:`1.5px solid ${r.color}`,
              background: activeFilters.has(r.label)?r.color:r.bg,
              color: activeFilters.has(r.label)?"#fff":"#1e293b"}}>
              <span style={{width:12,height:12,borderRadius:3,background:r.color,display:"inline-block"}} />
              {r.label} <span style={{opacity:.7}}>· {stats.counts[r.label]}</span>
            </button>
          ))}
          <button onClick={()=>toggleFilter(RESIDUE.label)} style={{
            display:"flex", alignItems:"center", gap:6, padding:"4px 10px", borderRadius:999,
            cursor:"pointer", fontSize:13, border:`1.5px dashed ${RESIDUE.color}`,
            background: activeFilters.has(RESIDUE.label)?RESIDUE.color:"#fff",
            color: activeFilters.has(RESIDUE.label)?"#fff":"#1e293b"}}>
            {RESIDUE.label} <span style={{opacity:.7}}>· {stats.residue}</span>
          </button>
        </div>
        <div style={{display:"flex", gap:16, alignItems:"center", fontSize:13, marginBottom:14, flexWrap:"wrap"}}>
          <label style={{cursor:"pointer"}}>
            <input type="checkbox" checked={onlyResidue} onChange={e=>setOnlyResidue(e.target.checked)} /> Isolate "original Rashi"
          </label>
          <label style={{cursor:"pointer"}}>
            <input type="checkbox" checked={showDebug} onChange={e=>setShowDebug(e.target.checked)} /> Show match basis (audit)
          </label>
          <span style={{color:"#64748b"}}>
            {stats.total} comments · {stats.residue} unattributed
            ({stats.total?Math.round(stats.residue/stats.total*100):0}% residue)
          </span>
        </div>
        <div dir="rtl" style={{display:"flex", flexDirection:"column", gap:10}}>
          {visible.map((c,i) => {
            const primary = c.sources[0] || RESIDUE;
            const isResidue = c.sources.length === 0;
            return (
              <div key={i} style={{background:primary.bg, borderRight:`5px solid ${primary.color}`,
                borderRadius:6, padding:"10px 14px",
                border: isResidue?`1.5px dashed ${RESIDUE.color}`:"1px solid #e2e8f0", borderRightWidth:5}}>
                <div dir="ltr" style={{fontSize:11, color:"#64748b", marginBottom:4, fontFamily:"monospace"}}>
                  Deut. {c.ref}
                  {c.sources.map(s => (
                    <span key={s.label} style={{marginInlineStart:6, padding:"1px 6px", borderRadius:4,
                      background:s.color, color:"#fff", fontSize:10}}>{s.label}</span>
                  ))}
                  {isResidue && <span style={{marginInlineStart:6, color:RESIDUE.color}}>· רש"י עצמאי?</span>}
                </div>
                <div style={{fontSize:18, lineHeight:1.7}}>{c.heText}</div>
                {showDebug && (
                  <div dir="ltr" style={{fontSize:11, color:"#475569", marginTop:6,
                    borderTop:"1px dotted #cbd5e1", paddingTop:4}}>
                    {c.sources.length ? c.sources.map(s => (
                      <div key={s.label} style={{marginBottom:2}}>
                        <strong style={{color:s.color}}>{s.label}</strong>
                        {" "}— matched "<em>{s.evidence.keyword}</em>" in {s.evidence.where}: …{s.evidence.snippet}…
                      </div>
                    )) : <span>no source keyword found in text</span>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
